# ============================================================
# officeboy — pilha completa (bot + Chrome headful + noVNC).
#
# Use o atalho `./bin/officeboy up` — ele escolhe o modo certo sozinho e
# resolve as portas. Este arquivo existe para quem quiser o Docker puro.
#
# PORTAS (definidas no .env):
#   BOT_UI_PORT    → dashboard/control server (padrão 1717)
#   BOT_NOVNC_PORT → navegador remoto via noVNC (padrão 7900, só no modo local)
#   BOT_CDP_PORT   → porta CDP do Chrome do host (padrão 9222, só no modo host)
#
# Modos:
#   local  → Chrome DENTRO do container (login via noVNC)
#   host   → usa o Chrome do HOST (já logado) via network_mode: host
# ============================================================

name: officeboy

x-comum: &comum
  build: .
  image: officeboy:latest
  # O watcher host-side (bin/officeboy-watch) usa esta label para abrir o Chrome
  # nativo no momento em que o container sobe.
  labels:
    - "officeboy.autostart=true"
  env_file:
    - .env
  volumes:
    # Perfil do Chrome (os logins persistem entre runs).
    - chrome-profile:/home/node/.chrome-profile
    # Estado e artefatos do bot.
    - bot-data:/app/data
    - bot-logs:/app/logs
    - bot-shots:/app/screenshots
    # Config e currículos vêm do host (dados pessoais, fora da imagem).
    # Escrita liberada: a UI (PUT /api/config/*) salva perfil/respostas/sites/
    # currículos direto no host — persiste entre rebuilds.
    - ./config:/app/config
    # Plugins MCP declarativos instalados pela UI.
    - ./plugins:/app/plugins
    - ./curriculos:/app/curriculos
    # .env montado para a UI ler/salvar variáveis (PUT /api/config/env).
    # O compose aplica os novos valores no recreate (`docker compose up -d`).
    - ./.env:/app/.env

services:
  # ---- Padrão: usa o Chrome do HOST (janela real, teclado real) ------------
  # O container conversa com o Chrome da sua máquina via CDP
  # (network_mode: host → 127.0.0.1 é o mesmo host).
  #
  # POLÍTICA: sem fallback para o Chrome interno. START_LOCAL_CHROME=false
  # força o modo "remoto": se o Chrome do host não estiver de pé, o container
  # encerra e o restart policy tenta de novo até ele aparecer. O bot NUNCA
  # trabalha num navegador que o usuário não está vendo (janela virtual).
  #
  # Para abrir o Chrome do host:  ./bin/officeboy chrome
  bot:
    <<: *comum
    container_name: officeboy
    restart: unless-stopped
    network_mode: host
    environment:
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: "${BOT_UI_PORT:-1717}"
      CONTROL_MODE: "true"
      CDP_ENDPOINT: "http://127.0.0.1:${BOT_CDP_PORT:-9222}"
      # false → exige o Chrome do host; sem ele o container não sobe.
      START_LOCAL_CHROME: "false"

  # ---- Modo container: Chrome DENTRO do container (noVNC) -------------------
  # Sobe com: docker compose --profile container up -d bot-container
  # Útil para rodar 24/7 numa VPS, onde não existe desktop.
  bot-container:
    <<: *comum
    container_name: officeboy-container
    profiles: ["container"]
    restart: unless-stopped
    ports:
      # ATENÇÃO: 0.0.0.0 expõe a UI (candidaturas, perfil e PII de
      # respostas.json) para a rede toda. Só use este modo em rede confiável
      # e considere DASHBOARD_TOKEN no .env (PUT /api/config/* exige o header
      # X-Config-Token quando definido).
      - "${BOT_UI_PORT:-1717}:3000"
      - "${BOT_NOVNC_PORT:-7900}:7900"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      CONTROL_MODE: "true"
      START_LOCAL_CHROME: "true"

volumes:
  chrome-profile:
  bot-data:
  bot-logs:
  bot-shots:
